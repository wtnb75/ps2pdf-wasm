name: main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: wtnb75/actions/node@59135f92ed798e7963ac725ba850ad93a40f2639 # v1.0.5
    - uses: wtnb75/actions/eslint@59135f92ed798e7963ac725ba850ad93a40f2639 # v1.0.5
    - uses: wtnb75/actions/vitest@59135f92ed798e7963ac725ba850ad93a40f2639 # v1.0.5
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      id: gs-wasm-cache
      with:
        path: |
          site/gs.js
          site/gs.wasm
          site/gs.data
        key: gs-wasm-${{ hashFiles('Taskfile.yml', 'build.sh') }}
    - uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
      if: steps.gs-wasm-cache.outputs.cache-hit != 'true'
    - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
      if: steps.gs-wasm-cache.outputs.cache-hit != 'true'
    - name: Build ghostscript wasm
      if: steps.gs-wasm-cache.outputs.cache-hit != 'true'
      run: task build
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: site
    - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

  deploy:
    needs: build
    if: github.ref_name == 'main'
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
