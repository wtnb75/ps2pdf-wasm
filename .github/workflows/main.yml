name: main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: wtnb75/actions/node@v1
    - uses: wtnb75/actions/eslint@v1
    - uses: wtnb75/actions/vitest@v1
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: gs-wasm-cache
      with:
        path: |
          site/gs.js
          site/gs.wasm
          site/gs.data
        key: gs-wasm-${{ hashFiles('Taskfile.yml', 'build.sh') }}
    - uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
      if: steps.gs-wasm-cache.outputs.cache-hit != 'true'
    - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
      if: steps.gs-wasm-cache.outputs.cache-hit != 'true'
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Build ghostscript wasm
      if: steps.gs-wasm-cache.outputs.cache-hit != 'true'
      run: task build
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: site
    - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

  deploy:
    needs: build
    if: github.ref_name == 'main'
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
